inputs:
  package:
    required: true
  arch:
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-14 clang-18 libc++-18-dev libc++abi-18-dev gcc-multilib g++-multilib pkg-config meson

    - name: Install recipe system dependencies
      shell: bash
      run: |
        DEPS_FILE="${{ inputs.package }}/SystemDeps"
        echo "Looking for deps file at: $DEPS_FILE"
        ls -la "${{ inputs.package }}" || echo "package dir doesn't exist"
        if [ ! -f "$DEPS_FILE" ]; then
          echo "No system deps for ${{ inputs.package }}"
          exit 0
        fi
        cat "$DEPS_FILE"

        ARCH_PKGS=$(grep -E '^apt:' "$DEPS_FILE" | sed 's/^apt://' || true)
        NOARCH_PKGS=$(grep -E '^apt-noarch:' "$DEPS_FILE" | sed 's/^apt-noarch://' || true)

        if [[ "${{ inputs.arch }}" == *x86* && "${{ inputs.arch }}" != *x64* ]]; then
          ARCH_PKGS=$(echo "$ARCH_PKGS" | sed -E 's/([a-zA-Z0-9.+_-]+)/\1:i386/g')
        fi

        PKGS="$ARCH_PKGS $NOARCH_PKGS"
        echo "Resolved packages: $PKGS"
        if [ -n "$(echo "$PKGS" | xargs)" ]; then
          sudo apt-get update
          sudo apt-get install -y $PKGS
        fi

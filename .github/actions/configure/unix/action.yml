inputs:
  package:
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: sudo apt-get install -y clang-18 gcc-multilib g++-multilib

    - name: Install dependencies
      shell: bash
      run: sudo apt-get install -y g++-14 gcc-multilib g++-multilib

    - name: Install recipe system dependencies
      shell: bash
      run: |
        DEPS_FILE="${{ inputs.package }}/SystemDeps"
        if [ ! -f "$DEPS_FILE" ]; then
          echo "No system deps for ${{ inputs.package }}"
          exit 0
        fi
        PKGS=$(grep -E '^apt:' "$DEPS_FILE" | sed 's/^apt://' || true)
        if [ -n "$PKGS" ]; then
          sudo apt-get update
          sudo apt-get install -y $PKGS
        fi

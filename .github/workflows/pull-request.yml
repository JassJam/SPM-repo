name: Test packages

on:
  pull_request:

concurrency:
  group: test-packages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
      has_packages: ${{ steps.changes.outputs.has_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed recipe versions
        id: changes
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          CANDIDATES=$(echo "$CHANGED" \
            | awk -F/ 'NF>=4 && length($1)==1 {print $1"/"$2"/"$3}' \
            | sort -u)
          EXISTING=""
          for d in $CANDIDATES; do
            if [ -d "$d" ] && [ -f "$d/CMakeLists.txt" ]; then
              EXISTING="$EXISTING$d"$'\n'
            fi
          done
          PACKAGES_JSON=$(printf '%s' "$EXISTING" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed recipe versions:"
          printf '%s' "$EXISTING"

  test-package:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux x86_64
          - ubuntu-24.04-arm # linux arm64
          - windows-latest # windows x86_64
          - macos-latest # macos arm64 (Apple Silicon)
        link: [static, shared]
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.link }} / ${{ matrix.package }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse package name/version
        id: pkg
        shell: bash
        run: |
          IFS='/' read -r LETTER NAME VERSION <<< "${{ matrix.package }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check platform support
        id: platform_check
        shell: bash
        run: |
          OUTPUT=$(cmake -DRECIPE_DIR="${{ matrix.package }}" -P ci/test-harness/unsupported.cmake)
          SKIP=false
          if echo "$OUTPUT" | grep -q '^SPM_UNSUPPORTED:'; then
            SKIP=true
            REASON=$(echo "$OUTPUT" | sed -n 's/^SPM_UNSUPPORTED://p')
            echo "::notice::Skipping ${{ matrix.package }} on ${{ matrix.os }} — $REASON"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Install recipe system dependencies
        shell: bash
        run: |
          DEPS_FILE="${{ matrix.package }}/SystemDeps"
          if [ ! -f "$DEPS_FILE" ]; then
            echo "No system deps for ${{ matrix.package }}"
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)
              PKGS=$(grep -E '^apt:' "$DEPS_FILE" | sed 's/^apt://' || true)
              if [ -n "$PKGS" ]; then
                sudo apt-get update
                sudo apt-get install -y $PKGS
              fi
              ;;
            macOS)
              PKGS=$(grep -E '^brew:' "$DEPS_FILE" | sed 's/^brew://' || true)
              if [ -n "$PKGS" ]; then
                brew install $PKGS
              fi
              ;;
            Windows)
              PKGS=$(grep -E '^choco:' "$DEPS_FILE" | sed 's/^choco://')
              if [ -n "$PKGS" ]; then
                choco install -y $PKGS
              fi
              ;;
          esac

      - name: Configure (fetch + build + test the recipe)
        if: steps.platform_check.outputs.skip != 'true'
        shell: bash
        run: |
          SHARED_FLAG=OFF
          if [ "${{ matrix.link }}" = "shared" ]; then
            SHARED_FLAG=ON
          fi
          cmake -S ci/test-harness -B build \
          	-DCMAKE_CXX_STANDARD=23 \
            -DSPM_TEST_PACKAGE_NAME="${{ steps.pkg.outputs.name }}" \
            -DSPM_TEST_PACKAGE_VERSION="${{ steps.pkg.outputs.version }}" \
            -DSPM_TEST_SHARED="$SHARED_FLAG"

      - name: Build (drives the recipe's isolated build)
        if: steps.platform_check.outputs.skip != 'true'
        shell: bash
        run: cmake --build build --config Release

      - name: Upload logs on failure
        if: failure() && steps.platform_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spm-logs-${{ matrix.os }}-${{ matrix.link }}-${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}
          path: |
            build/_spm/**/CMakeFiles/CMakeError.log
            build/_spm/**/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: Upload failed build on failure
        if: failure() && steps.platform_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spm-build-${{ matrix.os }}-${{ matrix.link }}-${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}
          path: build
          if-no-files-found: ignore
          retention-days: 7

name: Test packages

on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
      has_packages: ${{ steps.changes.outputs.has_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed recipe versions
        id: changes
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          CANDIDATES=$(echo "$CHANGED" \
            | awk -F/ 'NF>=4 && length($1)==1 {print $1"/"$2"/"$3}' \
            | sort -u)
          EXISTING=""
          for d in $CANDIDATES; do
            if [ -d "$d" ] && [ -f "$d/CMakeLists.txt" ]; then
              EXISTING="$EXISTING$d"$'\n'
            fi
          done
          PACKAGES_JSON=$(printf '%s' "$EXISTING" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed recipe versions:"
          printf '%s' "$EXISTING"

  test-package:
    name: ${{ matrix.config.name }} / ${{ matrix.link }} / ${{ matrix.package }}
    runs-on: ${{ matrix.config.os }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_packages == 'true'
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        config:
          # Linux / Clang
          - name: linux-x64-clang
            os: ubuntu-latest
            preset: unixlike-x64-clang-release
            output: linux-x64-clang
            configure-file: linux
          - name: linux-x86-clang
            os: ubuntu-latest
            preset: unixlike-x86-clang-release
            output: linux-x86-clang
            configure-file: linux

          # # Linux / GCC
          # - name: linux-x64-gcc
          #   os: ubuntu-latest
          #   preset: unixlike-x64-gcc-release
          #   output: linux-x64-gcc
          #   configure-file: linux
          # - name: linux-x86-gcc
          #   os: ubuntu-latest
          #   preset: unixlike-x86-gcc-release
          #   output: linux-x86-gcc
          #   configure-file: linux

          # # macOS / Clang
          # - name: macos-x64-clang
          #   os: macos-latest
          #   preset: unixlike-x64-clang-release
          #   output: macos-x64-clang
          #   configure-file: macos
          # - name: macos-arm64-clang
          #   os: macos-latest
          #   preset: unixlike-x64-clang-release
          #   output: macos-arm64-clang
          #   configure-file: macos

          # # macOS / GCC
          # - name: macos-x64-gcc
          #   os: macos-latest
          #   preset: unixlike-x64-gcc-release
          #   output: macos-x64-gcc
          #   configure-file: macos

          # # Windows / MSVC
          # - name: windows-x64-msvc
          #   os: windows-latest
          #   preset: windows-x64-msvc-release
          #   output: windows-x64-msvc
          #   configure-file: windows
          # - name: windows-x86-msvc
          #   os: windows-latest
          #   preset: windows-x86-msvc-release
          #   output: windows-x86-msvc
          #   configure-file: windows

          # # Windows / Clang
          # - name: windows-x64-clang
          #   os: windows-latest
          #   preset: windows-clang-release
          #   output: windows-x64-clang
          #   configure-file: windows
        link: [static, shared]
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
        cxx: [23]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse package name/version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          IFS='/' read -r LETTER NAME VERSION <<< "${{ matrix.package }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup ${{ matrix.config.name }}
        uses: ./.github/actions/configure/unix
        if: contains(matrix.config.os, 'ubuntu')
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.config.output }}

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.0"

      - name: Configure ${{ matrix.config.name }}
        shell: bash
        run: |
          SHARED_FLAG=OFF
          if [ "${{ matrix.link }}" = "shared" ]; then
            SHARED_FLAG=ON
          fi
          cmake -S .github -B build --preset ${{ matrix.config.preset }} \
          	-DCMAKE_CXX_STANDARD=${{ matrix.cxx }} \
            -DSPM_TEST_PACKAGE_NAME="${{ steps.pkg.outputs.name }}" \
            -DSPM_TEST_PACKAGE_VERSION="${{ steps.pkg.outputs.version }}" \
            -DSPM_TEST_SHARED="$SHARED_FLAG" \
            -DSPM_VERBOSE_OUTPUT="ON"

      - name: Build ${{ matrix.config.name }}
        shell: bash
        run: cmake --build build --config Release

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        with:
          name: spm-logs-${{ matrix.os }}-${{ matrix.link }}-${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}
          path: |
            build/_spm/**/CMakeFiles/CMakeError.log
            build/_spm/**/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

when:
  - event: tag

steps:
  package-spm:
    image: alpine:3.20
    commands:
      - mkdir -p dist
      - tar -czf dist/spm-release.tar.gz spm.cmake spm-recipe.cmake spm-yaml.cmake

  publish-spm:
    image: woodpeckerci/plugin-release
    settings:
      base-url: https://codeberg.org
      api-key:
        from_secret: FORGEJO_PUBLISH_TOKEN
      files:
        - dist/spm-release.tar.gz
      checksum: sha256
      file-exists: overwrite
      title: ${CI_COMMIT_TAG}
      target: ${CI_COMMIT_SHA}

when:
  - event: tag

steps:
  package-spm:
    image: alpine:3.20
    commands:
      - mkdir -p dist
      - tar -czf dist/spm-release.tar.gz spm.cmake spm-recipe.cmake spm-yaml.cmake
      - HASH=$(sha256sum dist/spm-release.tar.gz | cut -d' ' -f1)
      - sed -e "s|@SPM_TAG@|$CI_COMMIT_TAG|g" -e "s|@SPM_HASH@|$HASH|g" spm-bootstrap.cmake.in > dist/spm-bootstrap.cmake

  publish-spm:
    image: woodpeckerci/plugin-release
    settings:
      base-url: https://codeberg.org
      api-key:
        from_secret: FORGEJO_PUBLISH_TOKEN
      files:
        - dist/spm-release.tar.gz
        - dist/spm-bootstrap.cmake
      checksum: sha256
      file-exists: overwrite
      title: ${CI_COMMIT_TAG}

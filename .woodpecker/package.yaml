when:
  - event: tag

variables:
  - &release_plugin 'woodpeckerci/plugin-release'
  - &forge_url 'https://codeberg.org'
  - &spm_files
    - spm.cmake
    - spm-recipe.cmake
    - spm-yaml.cmake

steps:
  publish:
    image: *release_plugin
    settings:
      base-url:
        from_secret: FORGEJO_PUBLISH_URL
      api-key:
        from_secret: FORGEJO_PUBLISH_TOKEN
      files: *spm_files
      checksum: sha256
      title: ${CI_COMMIT_TAG}
      overwrite: true
    when:
      - event: tag
